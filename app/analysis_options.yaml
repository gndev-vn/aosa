include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - always_declare_return_types
    - annotate_overrides
    - avoid_dynamic_calls
    - avoid_print
    - avoid_unnecessary_containers
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters

analyzer:
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - "**/*.drift.dart"
    - build/**
    - android/**
    - ios/**
    - macos/**
    - linux/**
  errors:
    avoid_redundant_argument_values: ignore
    curly_braces_in_flow_control_structures: ignore
    directives_ordering: ignore
    invalid_annotation_target: ignore
    prefer_const_constructors: ignore
    prefer_const_declarations: ignore
    require_trailing_commas: ignore
    sort_child_properties_last: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
