name: aosa
description: Another Open Source Authenticator — Cross-platform TOTP manager.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.5.0
  flutter: ^3.27.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local database
  sqlite3: ^3.5.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.0

  # Secure storage
  flutter_secure_storage: ^11.1.1
  local_auth: ^3.0.2

  # Cryptography
  cryptography: ^2.7.0

  # Networking
  dio: ^5.11.1
  connectivity_plus: ^7.3.1

  # QR scanning
  mobile_scanner: ^7.4.1
  qr_flutter: ^4.1.0
  image_picker: ^1.2.3

  # Desktop features
  system_tray: ^2.0.0
  hotkey_manager: ^0.2.0
  window_manager: ^0.5.2

  # Notifications
  flutter_local_notifications: ^22.3.0

  # UI
  flutter_animate: ^4.5.0
  shimmer: ^4.0.0
  google_fonts: ^8.2.1

  # Utilities
  intl: ^0.20.3
  logger: ^2.8.0
  meta: ^1.15.0
  uuid: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
